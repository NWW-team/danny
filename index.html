<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Vibecoden</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.15);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 24px;
    }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      color: #0f172a;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
    }

    #output {
      margin-top: 20px;
      min-height: 24px;
      font-size: 14px;
      color: var(--accent);
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Vibecoden 101</span>
    <h1>Hello, World!</h1>
    <p>
      Dit is een klein voorbeeldproject om te laten zien hoe je samen met
      een AI-assistent (zoals Claude) code kunt schrijven — ook wel
      <strong>vibecoden</strong> genoemd. Klik op de knop hieronder.
    </p>
    <button id="greetBtn">Zeg hallo</button>
    <div id="output"></div>
    <footer>Gemaakt tijdens een vibecode-sessie ✨</footer>
  </div>

  <script>
    const button = document.getElementById("greetBtn");
    const output = document.getElementById("output");
    const messages = [
      "Hallo daar! 👋",
      "Vibecoden is gewoon praten met code als resultaat.",
      "Elke klik is een klein experimentje.",
      "Frontend zegt: hoi vanuit de browser!"
    ];

    button.addEventListener("click", () => {
      const random = messages[Math.floor(Math.random() * messages.length)];
      output.textContent = random;
    });
  </script>
</body>
</html>
